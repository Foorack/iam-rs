name: Publish to crates.io

# Publishing is bound to a tag push and to nothing else. crates.io checks three facts against
# GitHub's OIDC token before it hands out a credential that lives for thirty minutes:
#
#   repository owner   Foorack
#   repository name    iam-rs
#   workflow filename  release.yml
#
# Rename this file and the crate is silently unbound until that config is updated to match. There
# is no CARGO_REGISTRY_TOKEN in this repository, and there must never be one.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token that is exchanged for the publishing credential

    steps:
      - uses: actions/checkout@v4

      # A tag that does not name the version in Cargo.toml publishes something nobody asked for,
      # and crates.io has no undo. Stop before a credential is even requested.
      - name: The tag names the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME, but Cargo.toml says $version" >&2
            exit 1
          fi

      # The tag can land before the tests on the same push have answered, so this job asks for
      # itself rather than trusting that they did.
      - run: cargo test --all-features

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
